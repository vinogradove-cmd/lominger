<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Ломингер — оценка компетенций</title>
<style>
:root{--bg:#0e1015;--card:#161a22;--line:#242a36;--soft:#1e232d;
--txt:#eceff5;--dim:#9aa4b5;--acc:#2f6ce0;
--red:#e06a6a;--green:#3ba87d;--amber:#c99444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);
font:400 17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
padding:14px 12px calc(100px + env(safe-area-inset-bottom));
text-rendering:optimizeLegibility;overflow-wrap:break-word;hyphens:none}
.wrap{max-width:620px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin:0 2px 12px}
.bar{flex:1;height:4px;background:#1f2531;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.pinfo{font-size:13px;line-height:1.4;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:26px;line-height:1.22;font-weight:650;margin:0 0 10px;text-wrap:balance}
h2{font-size:21px;line-height:1.3;font-weight:600;margin:0 0 8px;text-wrap:balance}
p{margin:0 0 10px}
.dim{color:var(--dim)}
.hint{font-size:13px;line-height:1.55;color:var(--dim);margin:0 0 14px}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.4;color:var(--dim);margin-bottom:10px}
.meta-line{font-size:13px;line-height:1.5;color:var(--dim);margin:12px 0 0;font-variant-numeric:tabular-nums}
.num{display:inline-block;min-width:26px;height:24px;line-height:24px;text-align:center;border-radius:7px;
background:#232a37;color:#c9d3e6;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.shelf-r{color:var(--red)}
.shelf-g{color:var(--green)}
.shelf-y{color:var(--amber)}
#list{margin:0 -4px}
.it{display:flex;gap:12px;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--soft);cursor:pointer}
.it:last-child{border-bottom:0}
.it .bx{flex:0 0 22px;height:22px;border-radius:6px;border:1.5px solid #3c4453;display:flex;
align-items:center;justify-content:center;font-size:14px;line-height:1;margin-top:2px;transition:.12s}
.it .txt{flex:1;font-size:17px;line-height:1.45;color:var(--txt)}
.it.on .txt{font-weight:500}
.it.on .bx{color:#0e1015;font-weight:800}
.it.on.s-r .bx{background:var(--red);border-color:var(--red)}
.it.on.s-g .bx{background:var(--green);border-color:var(--green)}
.it.on.s-y .bx{background:var(--amber);border-color:var(--amber)}
.it.on.s-0 .bx{background:var(--acc);border-color:var(--acc)}
.cnt{font-size:13px;line-height:1.5;color:var(--dim);margin:14px 0 0;font-variant-numeric:tabular-nums}
.cnt.ok{color:var(--green)}
button{font:inherit;font-size:17px;font-weight:600;width:100%;min-height:52px;padding:14px 16px;
border-radius:12px;border:1px solid #2a313f;background:#1b212b;color:var(--txt);margin:8px 0;cursor:pointer}
button:active{opacity:.9}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.ghost{background:transparent;border-color:transparent;color:var(--dim);font-size:15px;
font-weight:400;min-height:44px;padding:8px}
button:focus-visible,.it:focus-visible,.row:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pill{display:inline-flex;flex-direction:column;gap:2px;background:#1b212b;border:1px solid var(--line);
border-radius:10px;padding:9px 12px;margin:0 6px 6px 0;font-size:13px;line-height:1.3;color:var(--dim)}
.pill b{font-size:21px;line-height:1.1;font-weight:650;color:var(--txt);font-variant-numeric:tabular-nums}
.verdict{border-left:3px solid #2a313f;padding:2px 0 2px 13px;margin:14px 0 0;font-size:17px;line-height:1.45}
.verdict b{display:block;margin-bottom:4px;font-size:17px;font-weight:650}
.verdict.r{border-left-color:var(--red)}
.verdict.g{border-left-color:var(--green)}
.verdict.y{border-left-color:var(--amber)}
.ex{font-size:17px;line-height:1.5;color:var(--dim);margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 2px;
border-bottom:1px solid var(--soft);cursor:pointer;font-size:17px}
.row:last-child{border-bottom:0}
.row .t{flex:1;line-height:1.4;font-weight:500}
.row .c{font-size:13px;line-height:1.4;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
#ft{position:fixed;left:0;right:0;bottom:0;display:none;gap:8px;
padding:10px 12px calc(10px + env(safe-area-inset-bottom));
background:rgba(14,16,21,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:9}
#ft button{margin:0;flex:1;padding:13px 8px;min-height:52px}
#ft button.primary{flex:1.6}
textarea{width:100%;min-height:200px;background:#11151c;color:#cfd7e6;border:1px solid var(--line);
border-radius:12px;padding:12px;font:400 14px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
.steps{counter-reset:s;margin:0 0 4px;padding:0;list-style:none}
.steps li{position:relative;padding:0 0 14px 32px;font-size:17px;line-height:1.45}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:2px;width:22px;height:22px;
border-radius:50%;background:#232a37;color:#c9d3e6;font-size:12px;font-weight:600;display:flex;
align-items:center;justify-content:center}
b.hl{font-weight:650}
a{color:#6f9df0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="bar"><i id="pb"></i></div><div class="pinfo" id="pinfo"></div></div>
<div id="app"></div>
</div>
<div id="ft"></div>
<script>
const DATA = [{"n":1,"t":"Ориентация на действие","b":"competency","nr":["Не тороплюсь использовать благоприятные возможности","Могу быть излишне методичным, склонным к перфекционизму, избегаю риска","Могу тянуть время","Могу ставить цели, не требующие особого напряжения сил","Могу действовать неуверенно","Могу знать, что нужно делать, но не решаться это сделать","Могу не обладать мотивацией; скучать на работе, или чрезмерно уставать"],"p":["Люблю напряженно работать","Настроен на активность и энергично выполняю задания, требующие напряжения сил","Не боюсь действовать при отсутствии подробного плана","Использую больше благоприятных возможностей, чем другие работники"],"o":["Могу быть трудоголиком","Могу настаивать на принятии решений без достаточного анализа","Могу принимать стратегически необоснованные решения","Могу прибегать к излишнему администрированию, чтобы добиться скорейшего выполнения работы","Могу иметь личные и семейные проблемы, вызванные отсутствием интереса и пренебрежением","Могу избегать выполнения важных обязанностей и заданий, не требующих напряжения сил","Могу пренебрегать личной жизнью, выдохнуться"],"m":[],"c":[]},{"n":2,"t":"Работа в неопределенных ситуациях","b":"competency","nr":["Испытываю беспокойство в меняющейся или неопределенной ситуации","Не справляюсь со сложными проблемами, которые не предполагают однозначного решения или результата","В неопределенных ситуациях могу нуждаться в большем объеме исходных данных и указаний, чем другие работники","Предпочитаю вникать в подробности и быть уверенным","Менее эффективно и продуктивно работаю в неоднозначных ситуациях","Слишком быстро завершаю работу","Могу испытывать сильную потребность все завершать","Могу стараться всегда выполнять работу одним и тем же образом"],"p":["Легко справляюсь с изменениями","Легкобо мнею темп и интенсивность работы","Способен принимать решения и действовать, не имея полной картины","Не бываю обескуражен неопределенной ситуацией","Не нуждаюсь в завершении дел для продолжения работы","Легко справляюсь с риском и неопределенностью"],"o":["Могу делать выводы, не имея достаточных исходных данных","Могу заполнять пробелы, додумывая то, чего нет на самом деле","Могу подрывать веру других в свои силы, не давая достаточно конкретных указаний","Могу недооценивать планомерное решение проблем","Могу игнорировать прецеденты и предысторию","Могу склоняться к новым и рискованным решениям, жертвуя апробированными","Могу все излишне усложнять"],"m":[],"c":[]},{"n":3,"t":"Доступность","b":"competency","nr":["Держусь отчужденно, на расстоянии","Испытываю неловкость при первых контактах","Могу быть застенчив, холоден или немногословен","У меня не склонен к откровенности, трудно понять, какой я на самом деле","Плохо устанавливаю раппорт, предпочитая сразу говорить о деле","Могу быть плохим слушателем или не проявлять интереса","Могу не отзываться на общественные события, которые имеют значение для окружающих","Могу быть излишне напряжен","Труден в общении"],"p":["Легко иду на контакт, готов к общению","Принимаю дополнительные меры, чтобы другие работники чувствовали себя свободно","Тепло, с симпатией и любезно отношусь к окружающим","Внимательно и терпеливо отношусь к конфликтам между другими работниками","Легко устанавливаю раппорт","Умею слушать","Хорошо осведомлен за счет получения неофициальной и неполной информации, что дает мне возможность своевременно принимать решения"],"o":["Могу тратить слишком много времени на то, чтобы установить раппорт на совещаниях","Могу ошибочно восприниматься как покладистый или легко поддающийся влиянию человек","Могу испытывать слишком сильное желание нравиться","Могу избегать негативных или неприятных контактов, даже если они необходимы","Могу пытаться сглаживать реальные вопросы и проблемы"],"m":[],"c":[]},{"n":4,"t":"Отношения с руководителем","b":"competency","nr":["Неловко чувствую себя с руководством","Могу вести себя напряженно в присутствии начальника","Могу неохотно воспринимать советы или указания начальника","Испытываю трудности в общении с руководством","У меня плохие отношения с начальником мешают продуктивной работе"],"p":["Адекватно реагирую на требования руководства и поддерживаю со мной хорошие отношения","Более старательно работаю для хорошего начальника","Готов учиться у руководителей, умеющих передавать знания и предоставляющих самостоятельность действий","Люблю учиться у своих предшественников","Готов решать сложные задачи и развиваться","Легко поддаюсь обучению"],"o":["Могу слишком полагаться на мнение руководства и постоянно обращаться за советом","Могу отвергать другие источники обратной связи и получения новых знаний","Могу брать пример не с того руководителя"],"m":[],"c":[]},{"n":5,"t":"Деловая проницательность","b":"competency","nr":["Не понимаю принципов деловой активности","Могу быть профессионалом, погруженным в свою узкую область деятельности","Не разбираюсь в бизнесе, которым занимается моя организация","Могу быть тактиком в узкой области","Не интересуюсь бизнесом в широком смысле слова или не имею соответствующего опыта"],"p":["Обладаю пониманием бизнеса","Знаком с текущим и возможным в будущем бизнес-курсом, практикой, тенденциями и изменениями в сфере электронной торговли и информации, затрагивающими меня с деятельность и организацию","Знаю конкурентную ситуацию","Знаком с работой стратегии и тактики на данном рынке"],"o":["Могу чрезмерно накапливать знания об отрасли и деловой активности и полагаться на эти знания и соответствующие навыки, уделяя недостаточное внимание личным навыкам, межличностному общению, вопросам управления и руководства"],"m":[],"c":[]},{"n":6,"t":"Карьерные устремления","b":"competency","nr":["Не имею точного представления о том, чего хочу добиться: работа мне наскучила, или я занимаюсь не своим делом, или работаю не в той организации; не готов идти на жертвы ради продвижения по службе","Не понимаю, как делается карьера и как продвигаются по службе; не умею себя подать, не знаю, как сделать так, чтобы меня заметили","Не решаюсь заговорить о своих карьерных желаниях и потребностях","Занимаю удобное для себя место; не хочу рисковать ради карьеры"],"p":["Знаю, чего хочу добиться в карьере, и активно над этим работаю","Обладаю необходимыми знаниями о карьерных возможностях","Стараюсь повернуть события в свою пользу","Использую открывающиеся возможности","Не жду, пока возможности будут мне предоставлены"],"o":["Могу выбрать неправильную карьеру","Могу выбирать только те задания, которые мне удаются","Могу казаться излишне амбициозным","Могу не обращать достаточного внимания на выполняемую работу","Могу болезненно относиться к рекомендациям, связанным с карьерой","Могу с недоверием относиться к решениям, связанным с моей карьерой, которые принимают другие люди"],"m":[],"c":[]},{"n":7,"t":"Забота о подчиненных","b":"competency","nr":["Могу не интересоваться личными нуждами своих непосредственных подчиненных","Могу быть слишком занят, чтобы хорошо знать своих подчиненных","Могу считать, что работа и личная жизнь не должны пересекаться","Могу быть более целеустремленным, чем окружающие","Могу быть очень сух и равнодушен в отношениях с подчиненными","Могу не уметь слушать или не проявлять интереса к надеждам и проблемам окружающих"],"p":["Проявляю интерес к работе и личной жизни своих подчиненных","Расспрашиваю об их планах, проблемах и пожеланиях","Знаком с их заботами и проблемами","Готов выслушать подчиненных, обращающихся с личными вопросами","Контролирую рабочую нагрузку и поощряю дополнительные усилия"],"o":["Могу столкнуться с проблемами из-за слишком сурового отношения к подчиненным","Могу давать подчиненным слишком много поводов для оправданий","Могу не стимулировать их к выполнению заданий, которых они не выполняли прежде","Могу проявлять излишний интерес к их личной жизни","Могу быть неспособен объективно оценивать показатели и потенциальные возможности подчиненных","Могу не понять, что пора прекратить проявлять заботу, если все попытки помочь отвергаются"],"m":[],"c":[] ющим","Уделяю столько внимания текущим потребностям потребителей, что не замечаю новых достижений"],"m":[],"c":[]},{"n":16,"t":"Своевременное принятие решений","b":"competency","nr":["Медлю с принятием или объявлением решения","Консервативен и осторожен","Могу тянуть время, собирать дополнительную информацию, чтобы обрести уверенность и избежать риска","Могу быть перфекционистом, стремиться асе делать правильно, всеми силами избегать критики","Могу быть неорганизованным и всегда принимать решения наспех, чтобы уложиться в определенный срок","Могу медленно принимать решения по сложным вопросам"],"p":["Своевременно принимаю решения, порой не имея полной информации, в сжатые сроки и находясь под давлением","Способен быстро принимать решения"],"o":["Могу поспешно делать выводы и принимать меры, не проанализировав информацию","Могу принимать решения ради принятия решений","Могу подавлять желание окружающих помочь в принятии решения","Могу считаться импульсивным и нетерпеливым","Могу стараться избегать решения вопросов и проблей, связанных с риском","Могу быстро принимать решения, чтобы избежать споров и личных неудобств"],"m":[],"c":[]},{"n":17,"t":"Качество принимаемых решений","b":"competency","nr":["Раньше других принимаю скоропалительные решения и делаю замечания, не проанализировав ситуацию","Могу слишком сильно полагаться на самого себя - не прошу о помощи","При принятии решений у меня случается всплеск эмоций и нетерпения","Могу не использовать правильные методы принятия решений, мыслительные модели или способы","Могу скоропалительно делать выводы на основании предрассудков, прежних решений или собственной недальновидности","Не хочу тратить время на обдумывание проблемы до принятия решения по мной","Могу не справиться со сложными ситуациями","Могу слишком долго ждать, «мучаясь» над каждой мелочью, чтобы избежать риска или ошибки","Могу искать одно большое «красивое решение», когда лучше было бы принять пять маленьких"],"p":["Принимаю удачные решения, не задумываясь, сколько времени это займёт; опираюсь на сочетание анализа, знаний, опыта и собственного суждения","У меня большинство принятых решений и предложений оказываются со временем правильными и точными"],"o":["Могу считать себя всегда правым или близким к совершенству, как будто я не могу ошибиться и не ошибаюсь никогда","меня могут считать упрямым, неготовым вести переговоры или идти на компромисс","Могу впасть в уныние, если мой совет отвергли","Могу недостаточно полагаться на менее информированных сотрудников"],"m":[],"c":[]},{"n":18,"t":"Делегирование","b":"competency","nr":["Не верю в делегирование обязанностей или не доверяю мне","Испытываю недостаток доверия или уважения к таланту подчиненных","Выполняю большинство задач самостоятельно или откладываю работу, приберегая для себя наиболее интересные задания","Не хочу или не знаю, как вдохновить сотрудников","Могу делегировать обязанности, но либо слабо контролирую, либо слишком опекаю","Могу делегировать обязанности, но не передаю полномочия","Не обладаю планом, по которому следую делегировать обязанности другим сотрудникам","Могу ставить задачи перед другими, не беря на себя труд вводить их в курс всего мероприятия"],"p":["Четко и в доступной форме делегирую как повседневные, так и особо важные задания и право принимать решения","Широко делегирую как обязанности, так и ответственность","Склонен доверять работе сотрудников","Позволяю непосредственным подчиненным завершить выполняемую ими работу"],"o":["Могу чрезмерно делегировать обязанности, не осуществляя в достаточной мере контроль над их исполнением и не оказывая помощи","Могу предъявлять нереальные требования к подчиненным или чрезмерно структурировать задания и решения перед тем, как их делегировать, что сковывает инициативу сотрудников","Могу исполнять собственные обязанности в недостаточном объеме"],"m":[],"c":[]},{"n":19,"t":"Развитие подчиненных","b":"competency","nr":["Не занимаюсь развитием или становлением подчинённых: в постоянной погоне за результатом и тактикой нет времени на долгосрочное развитие; считаю, что это не входит в мои обязанности"],"p":["Даю напряженные задания, требующие особой отдачи","Часто провожу беседы, направленные на развитие","В курсе всех карьерных устремлений каждого подчиненного","Составляю жесткие планы развития и выполняю их","Заставляю непосредственных подчиненных выполнять развивающие задания","Набираю подчиненных из тех, кто испытывает потребность в работе"],"o":["Могу сосредоточиться на развитии ограниченного числа непосредственных подчиненных за счет всей команды","Могу несправедливо распределять сложные задания","Могу придерживаться чересчур оптимистичных взглядов на то, до какой степени могут совершенствоваться непосредственные подчиненные"],"m":[],"c":[]},{"n":20,"t":"Способность направлять других","b":"competency","nr":["Не умею четко или ясно довести информацию до сведения подчиненных","Не ставлю целей, задач, ориентиров, ни к чему не стремлюсь","Раздаю задания, не имея четкого плана работы в целом","В большинстве случаев вещаю и поручаю; не слушая других","Имею любимчиков и плохо обращаюсь с остальными","Слишком нетерпелив, чтобы систематизировать работу других","Плохо делегирую обязанности","Не оставляю времени на руководство людьми","Недостаточно заинтересован в осуществлении руководства и предпочитаю работать над собственными заданиями"],"p":["Способен давать четкие директивы","Ставлю сложные задачи","Правильно распределяю объем работы","Представляю задание в хорошо спланированном и организованном виде","Обсуждаю с сотрудниками как саму работу, так и меня результаты","Способствую проявлению лучших способностей сотрудников","Искусен в коммуникации"],"o":["Могу чрезмерно увлекаться контролем","Могу оказывать на других расхолаживающий эффект, отговаривая от инициативы и идей; не терплю противодействия","Могу делегировать только мелкие части задания, не вдаваясь в подробности картины в целом","Могу быть чересчур авторитарным и пресекать изобретательность и инициативу"],"m":[],"c":[]},{"n":21,"t":"Управление многообразием (людей, групп)","b":"competency","nr":["Неэффективно руковожу группами людей, заметно отличающихся от меня","Могу испытывать дискомфорт в работе с сотрудниками, отличающимися от меня","Могу неподобающим образом обращаться с сотрудниками, отличающимися от меня","Охраняю землю от чужаков","Избегаю конфликтов и шума, вызванных различиями во мнениях и обсуждаемыми вопросами","Не вижу пользы многообразия","Обращаюсь одинаково со всеми, не учитывая их различий","Очень ограничен и этноцентричен, верю в превосходство своей группы","Могу относиться к людям исходя из негативных и унижающих стереотипов, от которых никак не могу избавиться"],"p":["Беспристрастно руковожу всеми типами и категориями людей","Эффективно работаю с людьми разных рас, национальностей, культур, физических недостатков, возрастов и полов","Нанимаю работников без учета их различий","Поддерживаю принципы равноправия, справедливости и равных возможностей для всех"],"o":["Могу делать слишком много поблажек людям, принадлежащим к какой-то конкретной категории","Могу применять разные стандарты и критерии в отношении разных категорий людей","Могу оказывать необоснованное предпочтение какой-то одной категории людей","Могу поступаться стандартами для достижения разнородности в группе. Вывери** от одного до трех из перечисленных ниже качеств для работы над ниш с целью компенсировать чрезмерное использование данной компетенции"],"m":[],"c":[]},{"n":22,"t":"Этика и моральные ценности","b":"competency","nr":["Могу иметь ценности, отличающиеся от принятых в организации","У меня сильный индивидуалист, слабо считающийся с ценностями других","Могу устанавливать свои собственные правила","Заставляю других испытывать дискомфорт","Могу руководствоваться исключительно интересами организации, что находится на грани допустимого или выхожу за всякие рамки","Могу недостаточно задумываться о собственных ценностях и не иметь представления, какое впечатление я произвожу","Моё поведение может слишком сильно меняться в зависимости от ситуации","Могу сложиться впечатление, что главной ценностью для меня являюсь забота о собственных интересах","У меня слово расходится с делом: говорю одно, делаю другое"],"p":["Придерживаюсь наиболее подходящего (для каждого коллектива) и эффективного набора основных ценностей и убеждений, как в лучшие, так и в плохие времена","Поступаю в соответствии с этими ценностями","Воздаю должное за следование установленным ценностям и порицаю обратное","Подтверждаю на практике то, что проповедую"],"o":["Могу упорно отстаивать свою позицию, основанную на убеждениях и ценностях, когда это неуместно","Могу быть слишком чувствителен к ситуациям, которые считаю «лакмусовой бумажкой» для проверки принципов, ценностей и убеждений","Могу слыть упрямым и неотзывчивым при необходимости изменить что-то или пойти на компромисс","Могу излишне критиковать тех, кто не придерживаюсь тех же ценностей","Могу прибегать к неэтичным высказываниям для завершения дискуссии"],"m":[],"c":[]},{"n":23,"t":"Справедливость по отношению к подчиненным","b":"competency","nr":["Не оцениваю своих подчиненных по заслугам","Не прислушиваюсь к тому, что важно и необходимо непосредственным подчиненным","Могу плохо понимать то, что необходимо людям, и быть не в состоянии описать, как они реагируют на моё руководство","Скрываю от людей информацию, которую они вправе знать","Могу быть непоследовательным и иметь любимчиков","Могу мало заботиться об оценке по заслугам или слишком занят, чтобы обращать на нее внимание","Могу делить людей на хороших и плохих и соответственно к мной относиться"],"p":["Руковожу подчиненными беспристрастно","Поступаю справедливо","Открыто дискутирую","Не провожу скрытую политику","Никому не отдаю предпочтение"],"o":["Могу тратить слишком много времени на то, чтобы всем угодить","Могу беспокоиться о том, чтобы распределять работу равномерно, не используя, не стимулируя, или не развивая самых способных сотрудников","Под необходимостью поступать справедливо могу скрывать реальные проблемы"],"m":[],"c":[]},{"n":24,"t":"Профессиональные/технические навыки","b":"competency","nr":["Мой уровень не соответствует нормам функциональной и технической квалификации","Допускаю технические/функциональные ошибки","У меня узость суждений и мелкие решения по причине недостатка знаний","Могу остановиться в своем развитии на некогда приобретенных навыках и освоенных технологиях","Могу быть неопытным, новичком в данной области и недостаточно проявлять к мной интерес","Не хватаю знания деталей, необходимых для углубленного анализа","Могу не оставлять себе времени на обучение"],"p":["Обладаю функциональной и технической подготовкой, позволяющей выполнять работу на высоком уровне"],"o":["Могу считаться слишком ограниченным/ограниченной","Могу слишком увлекаться собственным развитием и повышением навыков в технической и функциональной сфере, не используя в достаточной мере личные, межличностные навыки и навык руководства","Могу использовать глубокие технические знания и навыки во избежание неопределенности и риска"],"m":[],"c":[]},{"n":25,"t":"Прием на работу и подбор кадров","b":"competency","nr":["Плохо зарекомендовал себя в области приема на работу и подбора кадров","Подбираю людей, похожих на себя, или зацикливаюсь на одном-двух «любимых» качествах претендента","Выискиваю людей, похожих на себя","Перестраховываюсь при выборе","Не обеспечиваю разнообразия","Не способен распознать компетентность: нет критериев или слишком полагаюсь на интуицию","Недостаточно терпелив, чтобы дождаться более подходящей кандидатуры"],"p":["Имею «чутье» на одаренных людей","Подбираю лучших специалистов как со стороны, так и внутри предприятия","Не боюсь «сильных» профессионалов; составляю талантливые группы"],"o":["Могу пропустить людей, «медленно берущих старт»","Основываю свой выбор на поверхностных характеристиках","Могу сформировать группу из людей, не умеющих работать в команде","Отдаю предпочтение людям, которые, несмотря на способности, ляю информацию своевременно"],"o":["Могу предоставить избыточную информацию","Могу озадачить тем, что сообщаю информацию, которую человек не в силах обработать, или предварительные сведения, которые потом оказываются неверными"],"m":[],"c":[]},{"n":28,"t":"Управление инновациями","b":"competency","nr":["Плохо оцениваю творческие задачи и идеи","Плохо понимаю потребности рынка в инновациях","Не могу выбрать лучшую творческую идею среди представленных идей","Не предлагаю новых идей","Не принимаю творческие предложения других","Привержен привычным методам и задачам","Не понимаю процесса творчества или внедрения нового Слишком быстро предлагаю решения и делаю выводы","Являюсь перфекционистом, избегающим риска и боящимся неудач и ошибок","Не экспериментирую, чтобы научиться и усовершенствоваться и блокирую творчество других"],"p":["Способен воплощать в жизнь креативные идеи других людей","Правильно оцениваю, какие творческие идеи и замыслы будут иметь успех","Умею направлять творческую работу других людей","Могу провести «мозговой штурм» как фасилитатор","Способен предсказать рыночную продуктивность новых идей"],"o":["Могу ошибочно предпочитать новое и отвергать старое","Предпочитаю творческих людей и недооцениваю людей с меньшим творческим потенциалом","Произвожу впечатление выскочки при обдумывании и планировании"],"m":[],"c":[]},{"n":29,"t":"Честность и доверие","b":"competency","nr":["Не пользуюсь всеобщим доверием","Веду себя уклончиво или не имею твердой позиции","Могу относиться к людям предвзято или с безразличием","Считаюсь непоследовательным, поскольку мои дела расходятся со словами","Не умею сохранить конфиденциальность и разглашаю дела организации","Даю обещания, которые не могу выполнить","Не отслеживаю свои дела, создавая проблемы другим","Обвиняю других в своих ошибках","Преследую только свои интересы"],"p":["Пользуюсь доверием коллектива","Имею репутацию прямого и правдивого человека","Умею преподнести «горькую правду» правильным и способствующим работе о  целей достигнуто, некоторые упущены","У меня результаты работы соответствуют стандартному уровню"],"c":[]},{"n":82,"t":"Своевременность выполнения работы","b":"criteria","nr":["Всегда последним выполняю задание","Существенно нарушаю важные сроки и едва справляюсь с другими стандартными сроками","Отношусь к самым медлительным работникам или группам"],"p":["Всегда выполняю задание одним из первых","Выполняются даже необоснованные или труднодостижимые цели в отношении сроков, которые иногда даже перекрываются","Устанавливаю «стандарт скорости» для остальных"],"o":["Так стремлюсь выполнить работу в срок, что работаю на износ","С приближением срока завершения работы, в последнюю минуту, приношу в жертву такие веши, как качество, цена или трудовая атмосфера","Слишком большое значение придаю своевременности работы"],"m":["Большую часть работы заканчиваю вовремя","Сроки выполнения работ приемлемы и соответствуют стандартам","Большую часть заданий выполняю своевременно. Некоторые задания могу задерживать","Соблюдаю сроки, как и большинство других членов коллектива"],"c":[]},{"n":83,"t":"Качество результатов работы","b":"criteria","nr":["У меня результаты труда не соответствуют стандартам качества","Имеются заметные ошибки, работа выполнена небрежно","Обычно требуется переделка; даже после неё едва дотягиваю до среднего стандарта или минимально допустимого уровня"],"p":["Качество моей работы всегда высоко","Моя работа почти не имеет ошибок, принимается с первого предъявления, без брака и переделок"],"o":["Качество моей работы очень высокое, но перфекционизм снижает производительность, иногда — сроки, требует лишних ресурсов и времени","У меня стандарты качества превосходят обоснованно требуемый уровень"],"m":["Качество работ нормальное","Большинство моих результатов приемлемы, но есть немного ошибок, требующих исправления","Иногда бывает брак, потеря времени или ресурсов"],"c":[]},{"n":84,"t":"Использование ресурсов","b":"criteria","nr":["Использую ресурсы неэффективно и даже при наличии дополнительных ресурсов едва достигаю минимальных стандартов","Обычно превышаю бюджет по всем статьям или значительно перерасходую средства по некоторым статьям и полностью использую выделенные средства по другим статьям","Бесполезно растрачиваю время, деньги, материалы и труд персонала"],"p":["Использую меньше времени, материалов, денежных средств и рабочей силы, чем большинство других членов группы","Делаю больше, затрачивая меньше. Образец изобретательности","Всегда или почти всегда экономлю бюджет во всех областях"],"o":["Я достигаю результатов с экономией ресурсов, но иногда — за счёт снижения количества или качества","Настолько озабочен выполнением бюджета или плана, что от этого страдают другие дела","Могу снизить затраты столь резко, что это может вызвать проблемы на последующих этапах технологической цепочки"],"m":["Большая часть моих работ укладывается в бюджет, материалы и рабочая сила используются эффективно и по плану","Часть моих работ идёт с перерасходом средств","Использую ресурсы так же, как и большинство других членов группы"],"c":[]},{"n":85,"t":"Удовлетворение запросов потребителя","b":"criteria","nr":["Произвожу товары и услуги, не отвечающие минимальным стандартам и ожиданиям внутренних и внешних потребителей","Постоянно поступают жалобы, а минимальное удовлетворение потребителей требует дорогостоящих переделок"],"p":["Произвожу товары и услуги, постоянно отвечающие стандартам и ожиданиям внутренних и внешних потребителей, а иногда и превосходящие их","Постоянно осведомлен о потребностях и ожиданиях потребителей","Отзывы потребителей почти всегда положительны"],"o":["Даю потребителям слишком много по сравнению с тем, что организация получает взамен","Чрезмерно привержен производству товаров и услуг, которые неизменно соответствуют стандартам и ожиданиям внутренних и внешних потребителей и превосходят их","Использую слишком много ресурсов, упускаю из виду другие важные цели и становлюсь на позицию необоснованной защиты потребителей за счет других ценностей и линий поведения организации"],"m":["Произвожу товары и услуги, которые обычно соответствуют нормальным стандартам внутренних и внешних потребителей","Большая часть потребителей мной довольна, но иногда поступают жалобы, и чтобы удовлетворить всех, нужна переделка"],"c":[]},{"n":86,"t":"Свобода от незапланированной поддержки","b":"criteria","nr":["Требую значительно большей, чем в среднем подделки и времени руководителя и коллег для работы в соответствии с минимальными стандартами","Требую значительного внимания и поддержки чем большинство других людей или групп, чтобы вносить вклад в общее дело в соответствии со стандартом","У руководителей остаюсь мало времени для поддержки других людей или групп"],"p":["Обычно работаю в соответствии со стандартом без необходимости в поддержке","Требую минимальной поддержки со стороны начальства или из других источников и редко нуждаюсь в незапланированной поддержке или помощи","Независим","Не требую «понуканий»","Требую значительно меньше поддержки, чем остальные члены группы"],"o":["Настолько привержен самостоятельной работе, что становлюсь нелюдимым","Не хочу никакой помощи, иду собственным путем и работаю над достижением своих собственных целей","Могу тратить время и ресурсы, выполняя ненужную работу или работая неправильно"],"m":["Работаю в соответствии со стандартом при обычной или обоснованной поддержке, помощи и руководстве со стороны начальника или других членов коллектива","При наличии достаточной поддержки и времени беру на себя значительную часть работы"],"c":[]},{"n":87,"t":"Вклад в работу команд и подразделений","b":"criteria","nr":["Редко помогаю другим членам группы, подразделения или организации в выполнении работы или в совместной работе","Могу охладить рвение более крупной группы, неохотно помогая или даже отказывая в помощи","Скрываю ресурсы и информацию от других"],"p":["Всегда помогаю остальным членам группы или подразделения в выполнении работы","Одним из первых вызываюсь помочь другим добиться успеха","Делюсь всем, если это идет на благо своего рабочего коллектива или организации","Образец доброты, участия и сотрудничества"],"o":["Столь привержен коллективной работе, что иногда страдают мои собственные показатели","Трачу слишком много времени и энергии на помощь другим","Иногда мне не хватает времени или ресурсов на свою работу"],"m":["Обычно помогаю другим членам группы или подразделения в выполнении работы","Сотрудничаю с другими","Оказываю почти такую же помощь, что и остальные члены группы"],"c":[]},{"n":88,"t":"Навыки продуктивной работы","b":"criteria","nr":["Неупорядоченный подход к работе: занимаюсь текущими проблемами, легко отвлекаюсь на менее продуктивные задачи","Не всегда или не полностью выполняю указания","Теряю много энергии и времени из-за собственной неорганизованности","Достаточно продуктивен и организован в постановке соответствующих целей и в управлении временем","Работаю в соответствии с правильно расставленными приоритетами","В большинстве случаев выполняю указания"],"p":["Очень производителен и эффективен в планировании и выполнении работы","Точно определяю объем работы, создаю эффективные последовательности выполняемых действий и процессов и правильно распределяю ресурсы","Постоянно превосхожу большинство других работников или группы в производительности благодаря прекрасному"],"o":["Настолько озабочен выполнением работы в запланированном и упорядоченном режиме, что иногда опаздываю со сдачей работы или превосхожу даже достаточно высокие стандарты качества","Легко «выбиваюсь из колеи» незапланированными событиями и плохо приспосабливаюсь к переменам"],"m":[],"c":[]},{"n":89,"t":"Расширение навыков и возможностей","b":"criteria","nr":["Мало заинтересован в обучении и приобретении новых навыков и знаний","Остановился в развитии в комфортной зоне, становлюсь косным","Довольствуюсь теми навыками, которые имею"],"p":["Охотно осваиваю новые навыки и возможности в расчете на будущее","Обучение новым навыкам и приобретение н function paint(h,foot){
  document.getElementById('app').innerHTML=h;
  var ft=document.getElementById('ft');
  if(!foot){ft.style.display='none';ft.innerHTML=''}
  updateBar();
  window.scrollTo(0,0);
}
function updateBar(){
  var p=Object.keys(S.sk).length;
  document.getElementById('pb').style.width=(p/TOTAL*100).toFixed(1)+'%';
  document.getElementById('pinfo').textContent=p+' / '+TOTAL+' полок';
}
function idxOf(n,k){for(var i=0;i<STEPS.length;i++){if(STEPS[i].n===n&&STEPS[i].k===k)return i}return -1}
function cntTxt(v){return v>=2?('вывод есть — '+v+' отм.'):(v+' из 2')}
function verdict(a){
  var c=function(k){return (a[k]||[]).length};
  var nr=c('nr'),p=c('p'),o=c('o');
  if(nr>=2&&nr>=p&&nr>=o)return ['r','Зона роста','Ты узнал себя в '+nr+' признаках дефицита. По методике книги этого достаточно, чтобы считать компетенцию слабой. В план развития: одна привычка на 3 месяца и человек, который даёт обратную связь.'];
  if(o>=2&&o>=p&&o>=nr)return ['y','Перегиб','Сила есть, но она перекручена: '+o+' признака перегиба. Это не лечится развитием — только дозировкой и паузой перед действием.'];
  if(p>=2)return ['g','Сильная сторона','Ты отметил '+p+' проявления силы. Это опора: её не развивают, а осознанно используют и не дают перерасти в перегиб.'];
  if(nr+p+o===0)return ['','Пока без выводов','Ничего не отмечено. Если ни один пункт не про тебя — это тоже ответ.'];
  return ['','Пока не выражено','Одна отметка — по методике книги это ещё не сигнал, а случайность.'];
}
function verdictHTML(a){var v=verdict(a);
  return '<div class="verdict '+(v[0]||'')+'"><b>'+v[1]+'</b>'+v[2]+'</div>'}

function goStep(i){
  if(i<0){goHome();return}
  if(i>=STEPS.length){showResults();return}
  var st=STEPS[i], d=BY[st.n], k=st.k;
  S.ans[st.n]=S.ans[st.n]||{};
  var arr=S.ans[st.n][k]||(S.ans[st.n][k]=[]);
  var sh=shelves(d), pos=sh.indexOf(k)+1, info=SH[k];
  var h='<div class="card">'+
    '<div class="meta"><span class="num">'+d.n+'</span><span>'+BT[d.b]+
      (sh.length>1?', полка '+pos+' из '+sh.length:'')+'</span></div>'+
    '<h2>'+escH(d.t)+': <span class="shelf-'+info.c+'">'+info.n+'</span></h2>'+
    (info.hint?'<p class="hint">'+info.hint+'</p>':'')+
    '<div id="list">';
  (d[k]||[]).forEach(function(txt,j){
    var on=arr.indexOf(j)>=0;
    h+='<div class="it s-'+info.c+(on?' on':'')+'" onclick="mark(this,'+j+')"><div class="bx">'+(on?'✓':'')+
       '</div><div class="txt">'+escH(txt)+'</div></div>';
  });
  h+='</div><div class="cnt'+(arr.length>=2?' ok':'')+'" id="cnt">'+cntTxt(arr.length)+'</div></div>';
  window.__cur={n:st.n,k:k,i:i};
  paint(h,true);
  var ft=document.getElementById('ft');
  ft.style.display='flex';
  ft.innerHTML='<button onclick="goStep('+(i-1)+')">←</button>'+
    '<button onclick="skipStep()">Пропустить</button>'+
    '<button class="primary" onclick="nextStep()">Дальше →</button>';
}
function mark(el,j){
  var c=window.__cur; var a=(S.ans[c.n]||{})[c.k]||(S.ans[c.n][c.k]=[]);
  var p=a.indexOf(j);
  if(p>=0)a.splice(p,1); else a.push(j);
  el.classList.toggle('on');
  var bx=el.querySelector('.bx'); bx.textContent=el.classList.contains('on')?'✓':'';
  save();
  var cnt=document.getElementById('cnt');
  if(cnt){cnt.textContent=cntTxt(a.length);cnt.className='cnt'+(a.length>=2?' ok':'')}
}
function nextStep(){
  var c=window.__cur; if(!c)return;
  S.sk[c.n+'|'+c.k]=1; save();
  var nx=STEPS[c.i+1];
  if(nx&&nx.n===c.n)goStep(c.i+1); else goChapter(c.n);
}
function skipStep(){
  var c=window.__cur; if(!c)return;
  S.sk[c.n+'|'+c.k]=1; save(); nextStep();
}
function goChapter(n){
  var d=BY[n]; var a=S.ans[n]||{}; var sh=shelves(d);
  var h='<div class="card">'+
    '<div class="chip"><span class="num">'+d.n+'</span>'+BT[d.b]+'</div>'+
    '<h2>'+escH(d.t)+'</h2><p class="dim small">Полки пройдены. Отметь, что отпечаталось — можно вернуться в любую.</p>'+
    verdictHTML(a);
  h+='<div style="margin-top:14px">';
  sh.forEach(function(k){
    var c=(a[k]||[]).length, col=SH[k].c;
    h+='<div class="row" onclick="goStep('+idxOf(n,k)+')"><div class="t shelf-'+col+'">'+SH[k].n+'</div>'+
       '<div class="c">'+c+' отм. ›</div></div>';
  });
  h+='</div>';
  if(d.c&&d.c.length)h+='<p class="dim small" style="margin-top:12px">Компенсаторы по книге: '+d.c.join(', ')+'</p>';
  h+='</div>';
  window.__cur=null;
  paint(h,true);
  var ft=document.getElementById('ft'); ft.style.display='flex';
  var lastIdx=idxOf(n,sh[sh.length-1]);
  var nxt=STEPS[lastIdx+1];
  ft.innerHTML='<button onclick="goStep('+lastIdx+')">←</button>'+
    (nxt?'<button class="primary" onclick="goStep('+(lastIdx+1)+')">Дальше — №'+nxt.n+'</button>'
        :'<button class="primary" onclick="showResults()">К итогам</button>');
}
function nextUnpassed(){
  for(var i=0;i<STEPS.length;i++){var s=STEPS[i];if(!S.sk[s.n+'|'+s.k])return s}
  return null;
}
function goHome(){
  var nx=nextUnpassed(); var p=Object.keys(S.sk).length;
  var doneCh=DATA.filter(function(d){return shelves(d).every(function(k){return S.sk[d.n+'|'+k]})}).length;
  var h='<div class="card"><h1>Ломингер: что у тебя развито</h1>'+
   '<p class="dim small">Оценка по книге «FYI: For Your Improvement»: 67 компетенций, 9 критериев работы, 19 стопперов карьеры.</p>'+
   '<ol class="steps">'+
   '<li><b class="hl">Признак — это поступок, а не ярлык.</b> Читаешь пункт как «так со мной бывало?». Вспомнил два разных случая за полгода — отмечай.</li>'+
   '<li>У компетенции <b class="hl">три отдельные карточки</b>: что мешает, проявления силы, перегиб. Открываешь по одной — не надо листать длинную страницу.</li>'+
   '<li><b class="hl">Две отметки на одной карточке — вывод.</b> Одна — случайность. Ни одной — нейтрально, пропускай.</li>'+
   '</ol>'+
   '<div style="margin:0 0 16px"><b style="font-weight:650">Пример: «Ориентация на действие»</b>'+
   '<div class="ex"><span class="shelf-r">Могу тянуть время с решением</span>&nbsp;— что мешает</div>'+
   '<div class="ex"><span class="shelf-g">Люблю напряжённо работать</span>&nbsp;— проявление силы</div>'+
   '<div class="ex"><span class="shelf-y">Могу быть трудоголиком</span>&nbsp;— перегиб</div></div>'+
   '<button onclick="showHow()">Как понять, развито у меня или нет</button>'+
   '<div style="margin:12px 0 4px"><span class="pill"><b>'+doneCh+'</b>глав из '+DATA.length+'</span>'+
   '<span class="pill"><b>'+p+'</b>карточек из '+TOTAL+'</span></div>'+
   (nx?'<button class="primary" onclick="goStep('+idxOf(nx.n,nx.k)+')">'+(p?'Продолжить':'Начать')+' — №'+nx.n+' '+escH(BY[nx.n].t)+', '+SH[nx.k].n+'</button>'
      :'<button class="primary" onclick="showResults()">Показать итоги</button>')+
   '<button onclick="showList(\'competency\')">Все компетенции (1–67)</button>'+
   '<button onclick="showList(\'criteria\')">Критерии эффективности (81–89)</button>'+
   '<button onclick="showList(\'stopper\')">Стопперы карьеры (101–119)</button>'+
   '<button onclick="showResults()">Итоги и текст для отчёта</button>'+
   '<button class="ghost" onclick="resetAll()">Сбросить все ответы</button></div>';
  window.__cur=null;
  paint(h,false);
}
function showHow(){
  var h='<div class="card"><h2>Как понять, развито или нет</h2>'+
   '<p>Компетенцию нельзя оценить «в целом»: «я хорошо веду переговоры» — каждый раз по-разному. В книге у каждой компетенции есть наблюдаемые признаки: как она выглядит, когда её нет, когда она есть и когда её переложили. Поэтому ты не ставишь себе балл, а узнаёшь себя в конкретных поступках.</p>'+
   '<p><b class="hl">Три карточки.</b><br>«Что мешает» — делаю так, и это тормозит.<br>«Проявления силы» — делаю так, и это даёт результат.<br>«Перегиб» — делаю то же, но слишком сильно, и это мешает.</p>'+
   '<p><b class="hl">Как отмечать.</b> Возьми последние полгода. Пункт про тебя, если вспоминаешь два разных случая. Не вспоминаешь — не отмечай: сомнение всегда решается в пользу «не отмечать».</p>'+
   '<p><b class="hl">Почему две отметки.</b> Правило книги: один признак — совпадение, два — устойчивая привычка. Меньше двух — карточка остаётся нейтральной, и это нормальный ответ.</p>'+
   '<p><b class="hl">Что делать с итогом.</b> Зона роста — одна привычка на 3 месяца. Сильная сторона — опора, её не развивают. Перегиб — дозировать, а не качать.</p>'+
   '<button onclick="goHome()">← Понятно</button></div>';
  paint(h,false);
}
function resetAll(){if(confirm('Сбросить все ответы?')){S={ans:{},sk:{},done:{},intro:true};save();goHome()}}
function showList(b){
  var arr=DATA.filter(function(x){return x.b===b});
  var h='<div class="card"><h2>'+(b==='competency'?'Компетенции':b==='criteria'?'Критерии эффективности':'Стопперы карьеры')+'</h2>'+
        '<p class="dim small">Открывается карточка, с которой остановился.</p>';
  arr.forEach(function(x){
    var a=S.ans[x.n]||{}, sh=shelves(x);
    var marks=0, pass=0;
    sh.forEach(function(k){marks+=(a[k]||[]).length; if(S.sk[x.n+'|'+k])pass++});
    var v=verdict(a); var col=v[0]==='r'?'#ff9a9a':v[0]==='g'?'#7ce7b8':v[0]==='y'?'#ffcf8a':'#98a2b3';
    var first=null; for(var i=0;i<sh.length;i++){if(!S.sk[x.n+'|'+sh[i]]){first=sh[i];break}}
    var tgt=first?idxOf(x.n,first):idxOf(x.n,sh[0]);
    h+='<div class="row" onclick="goStep('+tgt+')"><div class="t"><span class="num">'+x.n+'</span>'+escH(x.t)+'</div>'+
       '<div class="c" style="color:'+col+'">'+pass+'/'+sh.length+(marks?' · '+marks+' отм.':'')+'</div></div>';
  });
  h+='<button class="ghost" onclick="goHome()">← На главную</button></div>';
  paint(h,false);
}
function scores(n){
  var a=S.ans[n]||{}; var g=function(k){return (a[k]||[]).length};
  return {nr:g('nr'),p:g('p'),o:g('o'),m:g('m')};
}
function showResults(){
  var rows=DATA.map(function(d){return {d:d,s:scores(d.n)}});
  var def=rows.filter(function(r){return r.s.nr>=2}).sort(function(x,y){return y.s.nr-x.s.nr});
  var over=rows.filter(function(r){return r.s.o>=2}).sort(function(x,y){return y.s.o-x.s.o});
  var str=rows.filter(function(r){return r.s.p>=2}).sort(function(x,y){return y.s.p-x.s.p});
  var empty=rows.filter(function(r){return !r.s.nr&&!r.s.p&&!r.s.o&&!r.s.m});
  var h='<div class="card"><h2>Итоги</h2>'+
    '<p class="dim small">Правило книги: 2 и более отметки в одном списке.</p>'+
    '<div><span class="pill"><b>'+def.length+'</b>зон роста</span>'+
    '<span class="pill"><b>'+str.length+'</b>сильных сторон</span>'+
    '<span class="pill"><b>'+over.length+'</b>перегибов</span>'+
    '<span class="pill"><b>'+empty.length+'</b>без ответа</span></div>';
  var block=function(title,sub,arr,cls,nk){
    var s='<div class="verdict '+cls+'"><b>'+title+'</b><span class="dim small">'+sub+'</span>';
    if(!arr.length)return s+'<div class="dim small" style="margin-top:6px">пока пусто</div></div>';
    arr.forEach(function(r){
      s+='<div class="row" onclick="goStep('+idxOf(r.d.n,nk)+')"><div class="t"><span class="num">'+r.d.n+'</span>'+escH(r.d.t)+
         '</div><div class="c">'+r.s[nk]+' отм. ›</div></div>';
    });
    return s+'</div>';
  };
  h+=block('Зоны роста','2+ признака дефицита — сюда вкладываться в первую очередь',def,'r','nr');
  h+=block('Перегибы','2+ признака перегиба — силу дозировать, а не развивать',over,'y','o');
  h+=block('Сильные стороны','2+ проявления силы — на это опираться',str,'g','p');
  h+='<p class="dim small" style="margin-top:14px">Готовый текст — скопируй и пришли мне, соберу план на 3 месяца:</p>'+
      '<textarea id="txt" readonly></textarea>'+
      '<button onclick="copyTxt()">Скопировать текст</button>'+
      '<button onclick="dlJson()">Скачать ответы (JSON)</button>'+
      '<button class="ghost" onclick="goHome()">← На главную</button></div>';
  window.__cur=null;
  paint(h,false);
  var ta=document.getElementById('txt'); if(ta)ta.value=exportText(def,over,str,empty);
}
function exportText(def,over,str,empty){
  var L=['ЛОМИНГЕР — мои результаты ('+new Date().toLocaleDateString('ru-RU')+')',''];
  function sect(title,arr,k,label){
    L.push(title+':');
    if(!arr.length)L.push('- пусто');
    arr.forEach(function(r){
      var a=S.ans[r.d.n]||{};
      var txt=((a[k]||[]).map(function(i){return (r.d[k]||[])[i]}).filter(Boolean)).join('; ');
      L.push('- '+r.d.n+' '+r.d.t+' ('+r.s[k]+' '+label+'): '+txt);
    });
    L.push('');
  }
  sect('ЗОНЫ РОСТА (дефицит)',def,'nr','отм.');
  sect('ПЕРЕГИБЫ (чрезмерно)',over,'o','отм.');
  sect('СИЛЬНЫЕ СТОРОНЫ',str,'p','отм.');
  if(empty.length)L.push('БЕЗ ОТВЕТА: '+empty.map(function(r){return r.d.n}).join(', '));
  return L.join('\n');
}
function copyTxt(){
  var t=document.getElementById('txt');
  t.removeAttribute('readonly'); t.select(); t.setSelectionRange(0,999999);
  var ok=false;
  try{ok=document.execCommand('copy')}catch(e){}
  t.setAttribute('readonly','readonly');
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value);ok=true}
  alert(ok?'Скопировано — вставь в чат с Ивой':'Выдели текст и скопируй вручную');
}
function dlJson(){
  var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lominger-answers.json';a.click();
}
goHome();
</script></body></html>
