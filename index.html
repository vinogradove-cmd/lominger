<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ломингер — оценка компетенций</title>
<style>
:root{--bg:#0f1117;--card:#181b23;--line:#262b36;--txt:#e8eaf0;--dim:#9aa3b2;--acc:#4f8cff;--red:#ff6b6b;--grn:#4ade80;--yel:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:86px}
header{position:sticky;top:0;z-index:10;background:rgba(15,17,23,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:17px;margin:0 0 6px}
.bar{height:6px;background:#242833;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.dim{color:var(--dim);font-size:13px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;width:100%;margin:8px 0;cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;text-align:center;font-weight:600}
button.ghost{background:transparent}
main{padding:12px 16px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.num{display:inline-block;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:1px 7px;margin-right:8px}
h2{font-size:18px;margin:4px 0 10px;line-height:1.25}
.grp{margin:14px 0 4px}
.grp h3{font-size:13px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 8px;color:var(--dim)}
.grp.r h3{color:var(--red)} .grp.g h3{color:var(--grn)} .grp.y h3{color:var(--yel)}
.it{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:#14171e;cursor:pointer}
.it .bx{flex:0 0 20px;height:20px;border-radius:6px;border:1.5px solid #3a4152;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;margin-top:1px}
.it.on{border-color:var(--acc);background:#182338}
.it.on .bx{background:var(--acc);border-color:var(--acc)}
.grp.r .it.on{border-color:var(--red);background:#2a1a1c} .grp.r .it.on .bx{background:var(--red);border-color:var(--red)}
.grp.g .it.on{border-color:var(--grn);background:#16241c} .grp.g .it.on .bx{background:var(--grn);border-color:var(--grn)}
.grp.y .it.on{border-color:var(--yel);background:#2a2416} .grp.y .it.on .bx{background:var(--yel);border-color:var(--yel)}
.hint{font-size:13px;color:var(--dim);margin:2px 0 10px}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,23,.97);border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px}
footer button{width:auto;flex:1;text-align:center;margin:0;padding:13px 10px;font-size:15px}
.res{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.pill{border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.pill b{font-size:18px;display:block}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border:0}
.tag{font-size:12px;color:var(--dim)}
textarea{width:100%;height:180px;background:#14171e;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px;font:13px/1.4 ui-monospace,monospace}
.navrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0}
.navrow button{width:auto;flex:1;text-align:center;margin:0;padding:10px}
.ok{color:var(--grn)} .warn{color:var(--yel)} .bad{color:var(--red)}
</style></head><body>
<header>
  <h1>Ломингер — оценка компетенций</h1>
  <div class="bar"><i id="pb"></i></div>
  <div class="dim" id="pinfo" style="margin-top:6px">—</div>
</header>
<main id="app"></main>
<footer id="ft" style="display:none"></footer>
<script>
const DATA = [{"n":1,"t":"Ориентация на действие","b":"competency","nr":["Не торопится использовать благоприятные возможности","Может быть излишне методичным, склонным к перфекционизму, избегает риска","Может тянуть время","Может ставить цели, не требующие особого напряжения сил","Может действовать неуверенно","Может знать, что нужно делать, но не решаться это сделать","Может не обладать мотивацией; скучать на работе, или чрезмерно уставать"],"p":["Любит напряженно работать","Настроен на активность и энергично выполняет задания, требующие напряжения сил","Не боится действовать при отсутствии подробного плана","Использует больше благоприятных возможностей, чем другие работники"],"o":["Может быть трудоголиком","Может настаивать на принятии решений без достаточного анализа","Может принимать стратегически необоснованные решения","Может прибегать к излишнему администрированию, чтобы добиться скорейшего выполнения работы","Может иметь личные и семейные проблемы, вызванные отсутствием интереса и пренебрежением","Может избегать выполнения важных обязанностей и заданий, не требующих напряжения сил Может пренебрегать личной жизнью, выдохнуться. КОМПЕНСАЦИЯ СМ.: 11,27, ЗЗ, З9. 41, 4З, 47, 5О, 51, 52, 6О, 66"],"m":[],"cmp":[11,27]},{"n":2,"t":"Работа в неопределенных ситуациях","b":"competency","nr":["Испытывает беспокойство в меняющейся или неопределенной ситуации","Не справляется со сложными проблемами, которые не предполагают однозначного решения или результата","В неопределенных ситуациях может нуждаться в большем объеме исходных данных и указаний, чем другие работники","Предпочитает вникать в подробности и быть уверенным","Менее эффективно и продуктивно работает в неоднозначных ситуациях","Слишком быстро завершает работу","Может испытывать сильную потребность все завершать","Может стараться всегда выполнять работу одним и тем же образом"],"p":["Легко справляется с изменениями","Легко меняет темп и интенсивность работы","Способен принимать решения и действовать, не имея полной картины","Не бывает обескуражен неопределенной ситуацией","Не нуждается в завершении дел для продолжения работы","Легко справляется с риском и неопределенностью"],"o":["Может делать выводы, не имея достаточных исходных данных","Может заполнять пробелы, додумывая то, чего нет на самом деле","Может подрывать веру других в свои силы, не давая достаточно конкретных указаний","Может недооценивать планомерное решение проблем","Может игнорировать прецеденты и предысторию","Может склоняться к новым и рискованным решениям, жертвуя апробированными","Может все излишне усложнять. КОМПЕНСАЦИЯ СМ.: 5,17, 24, ЗО,З5, З9, 4О, 47, 5О, 51, 52, 59, 61, 6З"],"m":[],"cmp":[5,17,24]},{"n":3,"t":"Доступность","b":"competency","nr":["Держится отчужденно, на расстоянии","Испытывает неловкость при первых контактах","Может быть застенчив, холоден или немногословен","Не склонен к откровенности, трудно понять, какой он на самом деле","Плохо устанавливает раппорт*, предпочитая сразу говорить о деле","Может быть плохим слушателем или не проявлять интереса","Может не отзываться на общественные события, которые имеют значение для окружающих","Может быть излишне напряжен","Труден в общении"],"p":["Легко идет на контакт, готов к общению","Принимает дополнительные меры, чтобы другие работники чувствовали себя свободно","Тепло, с симпатией и любезно относится к окружающим","Внимательно и терпеливо относится к конфликтам между другими работниками","Легко устанавливает раппорт","Умеет слушать","Хорошо осведомлен за счет получения неофициальной и неполной информации, что дает ему возможность своевременно принимать решения"],"o":["Может тратить слишком много времени на то, чтобы установить раппбрт на совещаниях","Может ошибочно восприниматься как покладистый или легко поддающийся влиянию человек","Может испытывать слишком сильное желание нравиться","Может избегать негативных или неприятных контактов, даже если они необходимы","Может пытаться сглаживать реальные вопросы и проблемы. КОМПЕНСАЦИЯ СМ.: 1, 5. 9,12,1З,16,17, 2О, ЗО, З4, З5, З7, 4З, 5О, 5З,57, 65"],"m":[],"cmp":[1,5]},{"n":4,"t":"Отношения с руководителем","b":"competency","nr":["Неловко чувствует себя с руководством","Может вести себя напряженно в присутствии начальника","Может неохотно воспринимать советы или указания начальника","Испытывает трудности в общении с руководством","Плохие отношения с начальником мешают продуктивной работе"],"p":["Адекватно реагирует на требования руководства и поддерживает с ним хорошие отношения","Более старательно работает для хорошего начальника","Готов учиться у руководителей, умеющих передавать знания и предоставляющих самостоятельность действий","Любит учиться у своих предшественников","Готов решать сложные задачи и развиваться","Легко поддается обучению"],"o":["Может слишком полагаться на мнение руководства и постоянно обращаться за советом","Может отвергать другие источники обратной связи и получения новых знаний","Может брать пример не с того руководителя. КОМПЕНСАЦИЯ СМ.: 1,17, З4. З8, 45,51, 5З. 54, 57"],"m":[],"cmp":[1,17]},{"n":5,"t":"Деловая проницательность","b":"competency","nr":["Не понимает принципов деловой активности","Может быть профессионалом, погруженным в свою узкую область деятельности","Не разбирается в бизнесе, которым занимается его организация","Может быть тактиком в узкой области","Не интересуется бизнесом в широком смысле слова или не имеет соответствующего опыта"],"p":["Обладает пониманием бизнеса","Знаком с текущим и возможным в будущем бизнес-курсом, практикой, тенденциями и изменениями в сфере электронной торговли и информации, затрагивающими его с деятельность и организацию","Знает конкурентную ситуацию","Знаком с работой стратегии и тактики на данном рынке"],"o":["Может чрезмерно накапливать знания об отрасли и деловой активности и полагаться на эти знания и соответствующие навыки, уделяя недостаточное внимание личным навыкам, межличностному общению, вопросам управления и руководства","КОМПЕНСАЦИЯ СМ.: 14,24,ЗО, З2,45,46, 54,57,58.6?"],"m":[],"cmp":[14,24]},{"n":6,"t":"Карьерные устремления","b":"competency","nr":["Не имеет точного представления о том, чего хочет добиться Работа могла ему наскучить, или он занимается не своим делом или работает не в той организации Не готов идти на жертвы для продвижения по служебной лестнице","Может не понимать, как делается карьера и как продвигаются по служебной лестнице Не умеет себя подать; не знает, как сделать так, чтобы его заметили","Не решается заговорить о своих карьерных желаниях и потребностях","Занимает удобное для себя место; не хочет рисковать ради карьеры"],"p":["Знает, чего хочет добиться в карьере и активно над этим работает","Обладает необходимыми знаниями о карьерных возможностях","Старается повернуть события в свою пользу","Использует открывающиеся возможности","Не ждет, пока возможности будут ему предоставлены"],"o":["Может выбрать неправильную карьеру","Может выбирать только те задания, которые ему удаются","Может казаться излишне амбициозным","Может не обращать достаточного внимания на выполняемую работу","Может болезненно относиться к рекомендациям, связанным с карьерой","Может с недоверием относиться к решениям, связанным с его карьерой, которые принимают другие люди КОМПЕНСАЦИЯ СМ.: 16.17,ЗО. З2. ЗЗ. 42,46, 48, 5О, 51, 5З, 55, 58, 6З. 66"],"m":[],"cmp":[16]},{"n":7,"t":"Забота о подчиненных","b":"competency","nr":["Может не интересоваться личными нуждами своих непосредственных подчиненных","Может быть слишком занят, чтобы хорошо знать своих подчиненных","Может считать, что работа и личная жизнь не должны пересекаться","Может быть более целеустремленным, чем окружающие","Может быть очень сух и равнодушен в отношениях с подчиненными","Может не уметь слушать или не проявлять интереса к надеждам и проблемам окружающих"],"p":["Проявляет интерес к работе и личной жизни своих подчиненных","Расспрашивает об их планах, проблемах и пожеланиях","Знаком с их заботами и проблемами","Готов выслушать подчиненных, обращающихся с личными вопросами","Контролирует рабочую нагрузку и поощряет дополнительные усилия"],"o":["Может столкнуться с проблемами из-за слишком сурового отношения к подчиненным","Может давать подчиненным слишком много поводов для оправданий","Может не стимулировать их к выполнению заданий, которых они не выполняли прежде","Может проявлять излишний интерес к их личной жизни","Может быть неспособен объективно оценивать показатели и потенциальные возможности подчиненных","Может не понять, что пора прекратить проявлять заботу, если все попытки помочь отвергаются. КОМПЕНСАЦИЯ СМ.: 9.12.1З.17.18. 2О. 2З. 27. З4. З5. 56. 57. 64"],"m":[],"cmp":[9]},{"n":8,"t":"Отношения с руководителями высшего звена","b":"competency","nr":["Недостаточно уверен в себе при контакте с высшим руководством","Может нервничать и казаться напряженным, вести себя не лучшим образом","Может терять самообладание или становится многословным, отвечая на вопросы руководителей","Не умеет повлиять или произвести впечатление на высшее руководство","Может не понимать, чего от него добивается высшее руководство","Говорит и делает вещи, не соответствующие ситуации"],"p":["Умеет устанавливать хорошие отношения с высшим руководством","Умеет общаться с руководителями без лишнего напряжения и нервозности","Понимает образ мышления и принципы работы руководителей высшего звена","Умеет находить оптимальные пути решения проблем, говоря на языке руководителей высшего звена и удовлетворяя их требованиям","Способен вырабатывать подходы, которые воспринимаются как приемлемые и позитивные"],"o":["Может слишком увлекаться руководством","Может восприниматься как слишком расчетливый или амбициозный","Может проводить слишком много времени с руководством, во всем ему подражать, переоценивать значение и полезность этих отношений","Делая карьеру, может слишком полагаться на примеры успешных людей","Может слишком вольно обращаться с конфиденциальной информацией. КОМПЕНСАЦИЯ СМ.: 5,9,12,17, 22, 24, 29, ЗО, 45, 51, 5З, 57 НЕКОТОРЫХ ПРИЧИНЫ","Неуверенность в себе в  нового, способствуя тем самым повышению производительности труда"],"o":["Может стать специалистом по качеству или перепроектированию за счет всего остального","Может вносить несущественные инновации, которые скорее разрушительны, чем полезны","Может отвергать другие подходы и игнорировать несогласных с ним. КОМПЕНСАЦИЯ СМ.: 2,З2. ЗЗ. 4О, 46, 57, 58"],"m":[],"cmp":[2]},{"n":64,"t":"Понимание других","b":"competency","nr":["Плохо чувствует группу людей","Не понимает механизмы работы группы людей или цели которым она служит 4","Не может предвидеть действия группы","Судит о группе предвзято или руководствуется стереотипами","Может понимать только те группы, которые имеют схожие цели и характеристики","Рассматривает группы только как отдельных людей","Не понимает, как группа влияет на взгляды и поведение людей","Предпочитает работать один на один; не может общаться с группами или мотивировать их","Может быть «бойцом-одиночкой» и не может стать членом никакого добровольного объединения"],"p":["Понимает причины поведения групп","Чувствует атмосферу группы в смысле намерений, должностей и потребностей; понимает, что ценит группа и какова ее мотивация","Может предвидеть действия группы в разных обстоятельствах"],"o":["Может тратить слишком много времени, пытаясь анализировать, что могла и что не могла бы сделать группа","Может переносить оценку, данную группе, на ее членов, позволяя тем самым своим личным впечатлениям о группе распространяться и на ее членов","Может пренебрегать вариативностью мнений","Может испытывать трудности при общении с одним членом группы, если находится при этом в состоянии конфликта с группой, членом которой данный человек является","Может тратить слишком много сил на понимание и анализ действий группы. КОМПЕНСАЦИЯ СМ.: 1, 2, 12, 1З, 16, 17, 21, З4, З7, 4О, 5О, 52, 5З, 57, 59"],"m":[],"cmp":[1,2,12,1]},{"n":65,"t":"Управление видением и целью","b":"competency","nr":["Нe может сформулировать и подать видение б организации","Плохо развиты презентационные способности","Не может сделать точное замечание или придумать захватывающую остроту","Плохо строит предположения в том, что касается неизвестного будущего","Обладает недостаточной харизмой, недостаточно страстно излагает, поэтому не может заразить своими идеями других и заставить их действовать","Не умеет упростить комплексную стратегию так, чтобы она стала понятна людям","Может не понимать, как происходят изменения","Его действия показывают, что он не обладает видением","Более комфортно чувствует себя в настоящем времени и месте"],"p":["Способен создать видение и чувство основной цели","Говорит не только о сегодняшнем дне","Говорит о возможностях","Создает ориентиры и знаки, для поддержки своего видения","Добивается того, что все начинают разделять его видение","Может вдохновить и мотивировать целые отделы организации"],"o":["Может отрываться от людей","Ему может недоставать терпения с теми, кто его/ее не понимает или не разделяет его видения и чувства цели","Может недоставать детальной ориентации и интереса к рутинному администрированию","Может в недостаточной мере осуществлять проверку исполнения каждодневных задач","КОМПЕНСАЦИЯ СМ.: З. 5,24,27,ЗЗ,З5, 41, 52, 64, 67 Примечание: Данный навык касается доведения до сведения сотрудников и претворения в жизнь принятого видения; о создании видения читайте в №58 «Стратегическая гибкость"],"m":[],"cmp":[]},{"n":66,"t":"Баланс работы и личной жизни","b":"competency","nr":["Ему недостает баланса между работой и личной жизнью","Чрезмерно занимается одним за счет другого","Может быть трудоголиком","Может испытывать скуку, находясь не на работе, или не умеет расслабляться","Может плохо распределять свое время и определять приоритеты; может реагировать на события пассивно","Не может отключиться от одной сферы жизни и полностью сконцентрироваться на другой","Не может удержать многочисленные и смешанные приоритеты, действующие одновременно","Переносит неприятности из одной жизненной сферы в другую","Может только создавать видимость того, что справляется с тем или с другим"],"p":["Поддерживает разумный баланс между работой и личной жизнью, таким образом, чтобы одно не доминировало над другим","Разносторонняя личность","Знает, как заниматься и работой и личной жизнью","Знает, как получить от работы и жизни то, что хочет"],"o":["Может быть недостаточно гибким, когда работа или личная жизнь требуют радикальных перемен","Может не хотеть подстраивать одно под другое","Может ценить баланс выше временного дискомфорта","Может навязывать другим свой взгляд на баланс работы и личной жизни. выберите от одного до трех из перечисленных ниже качеств для работы над ними с целью компенсирова ть чрезмерное использование данной компетенции","КОМПЕНСАЦИЯ СМ.: 2, 6.11.12,17, 22. 2З, З2, 4О, 45, 46, 5О, 54,55"],"m":[],"cmp":[2,6]},{"n":67,"t":"Письменная коммуникация","b":"competency","nr":["Плохо излагает свои мысли на бумаге","Может с трудом изложить суть вопроса","Может быть слишком многословен или краток или имеет грамматические/стилистические проблемы","Не может логически аргументировать","Не умеет приспосабливаться к аудитории; может писать в одном стиле"],"p":["Способен писать четко и кратко, сообразно различным ситуациям и стилям","Способен посредством письма достичь требуемого эффекта"],"o":["Может слишком много времени тратить на письменное изложение","Может слишком часто стараться достичь совершенства, когда достаточно более простого варианта","Может слишком критиковать написанное другими. КОМПЕНСАЦИЯ СМ.: 1, 2,З,12,15,17 27,З2, З8,44,46,48,5О, 5З, 57, 62"],"m":[],"cmp":[1,2]},{"n":81,"t":"Количественная оценка результатов труда","b":"criteria","nr":["Малый объем выполненной работы","Отставание от большинства других людей или групп","Важные цели не достигнуты","Производительность ниже, чем у большинства других работников","Одни цели достигнуты, но другие упущены"],"p":["Поразителен объем работ, выполняемый таким работником или группой","Независимо от того, насколько высоки поставленные цели, объем сделанного перекрывает их во всех областях","Почти всегда лидер по производительности","Обозначает степень трудности работы для остальных"],"o":["Объем работ, выполняемый таким лицом или группой, столь велик, что иногда страдают качество и настрой из-за сверхвысокой интенсивности труда и сверхнапряженного ритма работы","Такой работник может концентрироваться на своей работе до такой степени, что страдают все остальные дела, включая заботу о ближних. КОМПЕНСАЦИЯ СМ.: 7,17, 2О, 2З, ЗЗ, З6, 41, 42, 5О, 52, 6О"],"m":["Объем выполненной работы приемлем и приблизительно соответствует объему, производимому другими людьми или подобными группами","Большинство производственных целей достигнуто, некоторые упущены","Результаты работы соответствуют стандартному уровню"],"cmp":[7,17,2]},{"n":82,"t":"Своевременность выполнения работы","b":"criteria","nr":["Всегда последним выполняет задание","Существенно нарушает важные сроки и едва справляется с другими стандартными сроками","Относится к самым медлительным работникам или группам"],"p":["Всегда выполняет задание одним из первых","Выполняются даже необоснованные или труднодостижимые цели в отношении сроков, которые иногда даже перекрываются","Устанавливает «стандарт скорости» для остальных"],"o":["Так сильно стремится выполнить работу в срок, что работает слишком интенсивно","С приближением срока завершения работы, в последнюю минуту, приносит в жертву такие веши, как качество, цена или трудовая атмосфера","Слишком большое значение придается своевременности выполнению работы. ПРИЧИНЫ","Не может сказать «нет","Неорганизован","Не делегирует обязанности","Не устанавливает приоритеты","Несконцентрирован","Неизобретателен","Отказывается от помощи","Медленно принимает решения","Не выдерживает поставленные сроки"],"m":["Большую часть работы заканчивает вовремя","Сроки выполнения работ приемлемы и соответствуют стандартам","Большую часть заданий выполняет своевременно. Некоторые задания может задерживать","Соблюдает сроки, как и большинство других членов коллектива"],"cmp":[]},{"n":83,"t":"Качество результатов работы","b":"criteria","nr":["Результаты труда не соответствуют стандартам качества","Имеются заметные ошибки, работа выполнена небрежно","Обычно требуется переделка для приведения к стандартам и даже после переделки едва дотягивает до среднего стандарта или минимально допустимого уровня качества"],"p":["Качество работы такого лица или группы всегда высоко","Работа почти не имеет ошибок, принимается с первого предъявления, почти не содержит брака и не требует переделки"],"o":["Результаты труда имеют очень высокое качество, но перфекционизм приводит к снижению производительности, иногда - к несоблюдению сроков, использованию избыточного количества ресурсов или времени","Стандарты качества превосходят обоснованно требуемый уровень. КОМПЕНСАЦИЯ СМ.: 1,2,16,З9,4О, 51, 52"],"m":["Качество работ нормальное","Большинство результатов приемлемы, но имеется небольшое количество ошибок, требующих исправления","Иногда встречается брак, потеря времени или ресурсов"],"cmp":[1,2,16]},{"n":84,"t":"Использование ресурсов","b":"criteria","nr":["Использует ресурсы неэффективно и даже при наличии дополнительных ресурсов едва достигает минимальных стандартов","Обычно превышает бюджет по всем статьям или значительно перерасходует средства по некоторым статьям и полностью использует выделенные средства по другим статьям","Бесполезно растрачивает время, деньги, материалы и труд персонала"],"p":["Использует меньше времени, материалов, денежных средств и рабочей силы, чем большинство других членов группы","Делает больше, затрачивая меньше Образец изобретательности","Всегда или почти всегда экономит бюджет во всех областях"],"o":["Хотя такое лицо или группа достигает результатов с экономией выделенных ресурсов, иногда это происходит за счет снижения количества или качества","Настолько озабочен выполнением бюджета или плана, что от этого страдают другие дела","Может снизить затраты столь резко, что это может вызвать проблемы на последующих этапах технологической цепочки. КОМПЕНСАЦИЯ СМ.; 15,17,З9,42, 5О, 52, 5З, 6З некоторые ПРИЧИНЫ","Не может отказать","Неорганизован","Превышает стандарты качества","Нетерпелив","Не планирует работу","Мало делегирует полномочий","Отказывается от помощи","Отвергает предложения","Медленно принимает решения"],"m":["Большая часть работ укладывается в бюджет, с эффективным и запланированным использованием материалов и рабочей силы","Часть работ может выполняться с перерасходом средств","Использует ресурсы так же, как и большинство других членов группы"],"cmp":[]},{"n":85,"t":"Удовлетворение запросов потребителя","b":"criteria","nr":["Производит товары и услуги, не отвечающие минимальным стандартам и ожиданиям внутренних и внешних потребителей","Постоянно поступают жалобы и минимальное удовлетворение потребителей требует дорогостоящих переделок"],"p":["Производит товары и услуги, постоянно отвечающие стандартам и ожиданиям внутренних и внешних потребителей, а иногда и превосходящие их","Постоянно осведомлен о потребностях и ожиданиях потребителей","Отзывы потребителей почти всегда положительны"],"o":["Дает потребителям слишком много по сравнению с тем, что организация получает взамен","Чрезмерно привержен производству товаров и услуг, которые неизменно соответствуют стандартам и ожиданиям внутренних и внешних потребителей и превосходят их","Использует слишком много ресурсов, упускает из виду другие важные цели и становится на позицию необоснованной защиты потребителей за счет других ценностей и линий поведения организации. выберите от одного до трех из перечисленных ниже качеств для работы над ними с целью компенсировать чрезмерное использование данной компетенции","КОМПЕНСАЦИЯ СМ.: 5,9,12,З4, З5, З8, З9, 42, 5О, 51, 52,5З,57, 58,59"],"m":["Производит товары и услуги, которые обычно соответствуют нормальным стандартам внутренних и внешних потребителей","Большая часть потребителей довольна, при этом иногда поступают жалобы, и для удовлетворения всех потребителей иногда требуется некоторая переделка"],"cmp":[5,9,12]},{"n":86,"t":"Свобода от незапланированной поддержки","b":"criteria","nr":["требует значительно большей, чем в среднем подделки и времени руководителя и коллег для работы в соответствии с минимальными стандартами","Требует значительного внимания и поддержки чем большинство других людей или групп, чтобы вносить вклад в общее дело в соответствии со стандартом","У руководителей остается мало времени для поддержки других людей или групп"],"p":["Обычно работает в соответствии со стандартом без необходимости в поддержке","Требует минимальной поддержки со стороны начальства или из других источников и редко нуждается в незапланированной поддержке или помощи","Независим. Не требует «понуканий","Требует значительно меньше поддержки, чем остальные члены группы"],"o":["Столь привержен к независимой работе, что становится нелюдимым","Не хочет никакой помощи, идет собственным путем и работает над достижением своих собственных целей","Может тратить время и ресурсы, выполняя ненужную работу или работая неправильно. КОМПЕНСАЦИЯ СМ.: З,15,ЗЗ,42, 5О, 5З, 6О, 65"],"m":["Работает в соответствии со стандартом при обычной или обоснованной поддержке, помощи и руководстве со стороны начальника или других членов коллектива","При наличии достаточной поддержки и времени берет на себя значительную часть работы"],"cmp":[]},{"n":87,"t":"Вклад в работу команд и подразделений","b":"criteria","nr":["Редко помогает другим членам группы, подразделения или организации в выполнении работы или в совместной работе","Может охладить рвение более крупной группы, неохотно оказывая помощь или даже отказывая в ней","Скрывает ресурсы и информацию от других"],"p":["Всегда помогает остальным членам группы или подразделения в выполнении работы","Одним из первых вызывается помочь другим добиться успеха","Делится всем, если это идет на благо своего рабочего коллектива или организации","Образец доброты, участия и сотрудничества"],"o":["Столь привержен коллективной работе, что иногда страдают его собственные показатели","Тратит слишком много времени и энергии на помощь другим","Иногда не хватает времени или ресурсов на выполнение своей собственной работы. КОМПЕНСАЦИЯ СМ.: 12, З7, 5О, 5З, 57"],"m":["Обычно помогает другим членам группы или подразделения в выполнении работы","Сотрудничает с другими","Оказывает почти такую же помощь, что и остальные члены группы"],"cmp":[12]},{"n":88,"t":"Навыки продуктивной работы","b":"criteria","nr":["Неупорядоченный подход к работе Работает над текущими проблемами, легко отвлекается на менее продуктивные задачи","Не всегда или не полностью выполняет указания","Теряет много энергии и времени из-за собственной неорганизованности. СРЕД","Достаточно продуктивен и организован в постановке соответствующих целей и в управлении временем","Работает в соответствии с правильно расставленными приоритетами","В большинстве случаев выполняет указания"],"p":["Очень производителен и эффективен в планировании и выполнении работы","Точно определяет объем работы, создает эффективные последовательности выполняемых действий и процессов и правильно распределяет ресурсы","Постоянно превосходит большинство других работников или группы в производительности благодаря прекрасному"],"o":["Настолько озабочен выполнением работы в запланированном и упорядоченном режиме, что иногда опаздывает со сдачей работы или превосходит даже достаточно высокие стандарты качества","Легко «выбивается из колеи» незапланированными событиями и плохо приспосабливается к переменам. КОМПЕНСАЦИЯ СМ.: 2,З2,ЗЗ,4О, 46, 51, 5З"],"m":[],"cmp":[2]},{"n":89,"t":"Расширение навыков и возможностей","b":"criteria","nr":["Мало заинтересован в обучении и приобретении новых навыков и знаний","Остановился в развитии в комфортной зоне, становится косным","Довольствуется теми навыками, которые имеет"],"p":["Охотно осваивает новые навыки и возможности в расчете на будущее","Обучение новым навыкам и приобретение новых возможностей считает приоритетной задачей","Обладает большим количеством и лучшими навыками в конце года по сравнению с началом года"],"o":["Проводит так много времени, совершенствуя свои навыки, что недостаточно сосредоточен на повседневной работе","Иногда работает над такими навыками, которые в дальнейшем оказываются лишь маргинально полезными. КОМПЕНСАЦИЯ СМ.; 1,16,17,З2, 5О, 51, 5З, 58"],"m":["Проявляет интерес к обучению и приобретению новых навыков в такой же степени, как и остальные","Если это входит в рамки служебных обязанностей, научится чему-либо, если представится случай","Как правило, осваивает новые навыки, требуемые для работы на ближайшую перспективу"],"cmp":[]},{"n":101,"t":"Неспособность адаптироваться к переменам","b":"stopper","nr":["Испытывает затруднения при работе с новым начальством, теряется при внесении изменений в стратегии, планы и программы, при столкновении с новым культурным окружением, мировоззрением","Может безосновательно или слишком бурно выражать несогласие с начальством относительно миссии, ценностей, стратегии и тактики","Не умеет сохранять хорошие отношения с человеком, с которым не согласен"],"p":["Адаптируется к переменам","Приводит конструктивные контраргументы, но затем действует в соответствии с изменившимися обстоятельствами","Способен принять изменения, даже если не вполне согласен сними","Легко переключается на новые методы, цели и т. д","Находит общий язык с начальством","Умеет взаимодействовать с «плохим» начальством","Не теряет равновесия в конфликтных ситуациях","Воспринимает точку зрения и мнения окружающих"],"o":[],"m":[],"cmp":[]},{"n":102,"t":"Плохое администрирование","b":"stopper","nr":["Недооценивает значение мелочей","Может испортить дело из-за мелочи","Слишком много обещает и не выполняет обещанного","Не придает значения ключевым мелочам","Забывает об обещаниях, не зафиксированных письменно","Впопыхах доделывает все в последний момент","Хватается за новое дело, не доведя до конца предыдущее"],"p":["Умеет организовать работу, придает достаточное значение мелочам","Надежен: держит под контролем текущие дела, выполняет то, что обещал","Хороший администратор: все у него идет так, как нужно","Умеет определять приоритеты","Умеет беречь время","Не боится сказать «нет», если не может заняться каким-либо делом","В большинстве случаев делает все вовремя и не нарушает сроков"],"o":[],"m":[],"cmp":[]},{"n":103,"t":"Чрезмерное честолюбие","b":"stopper","nr":["Сосредоточен исключительно на себе и на продвижении по. служебной лестнице, иногда за счет других","Готов интриговать и «идти по трупам» ради повышения в ' должности","РУКОВОДИТ «на публику», чтобы создать себе репутацию в ' глазах начальства и разрекламировать себя"],"p":["Не преувеличивает значение карьерного роста » Для него главное - хорошо сделать работу","предоставляет результатам работы говорить за себя","Помогает другим продвигаться вперед","Не стремится присвоить все лавры в случае успеха","Не кичится своими способностями и умениями"],"o":[],"m":[],"cmp":[]},{"n":104,"t":"Высокомерие","b":"stopper","nr":["Убежден, что он один знает «единственно правильный ответ","Не признает или игнорирует то, что сделано другими","Может вести себя высокомерно и холодно, тем самым, унижая других","Может противопоставить себя другим, если они не соглашаются принять его «условия игры","Всегда сохраняет дистанцию между собой и другими"],"p":["Умеет слушать и понимать других","С ним легко говорить","Проявляет интерес к мнениям других, даже если они противоречат его собственным","Приглашает других участвовать в обсуждений проблем и помогает им достичь успеха","Ценит мнение других","Считает других равными партнерами","Готов разделить с другими лавры в случае успеха","Не подчеркивает свое более высокое положение в иерархии и не стремится подавлять других","Сближается с некоторыми сотрудниками и хорошо взаимодействует со многими"],"o":[],"m":[],"cmp":[]},{"n":105,"t":"Подрыв доверия","b":"stopper","nr":["Говорит одно, а имеет в виду или делает другое","Бывает непоследовательным и непредсказуемым","Не выполняет обещаний","не держит слово"],"p":["Всегда держит слово","Умеет держать язык за зубами","Его слова не расходятся с делами","Всегда доводит дело до конца","Надежен, предсказуем","Пересматривает свои действия, когда назревает проблема"],"o":[],"m":[],"cmp":[]},{"n":106,"t":"Неспособность к обучению и восприятию нового","b":"stopper","nr":["Не умеет и не хочет приобретать новые навыки и умения в области межличностных отношений, профессиональной сфере управлении, не воспринимает новые ПОДХОДЫ И приемы","Не считает нужным менять что-либо в себе, даже когда этого требуют новые или изменившиеся задачи","Не отличается широтой кругозора и интересов","Почт не пользуется обучающими приемами","Не стремится чему-то научиться","Не отличается любознательностью","Плохо понимает самого себя"],"p":["Всегда готов учиться, интересуется новым и более совершенным","Отличается широтой взглядов и кругозора","Стремится установить обратную связь с людьми и внимательно прислушивается к тому, что они говорят","Конструктивно воспринимает критику","Постоянно стремится к самосовершенствованию","Следит за тем, как окружающие относятся к его поведению, поступкам и готов изменить их, если нужно","Хорошо понимает, что движет людьми и коллективами","Чуток к мелким сигналам, которые подают ему окружающие","Понимает, когда от него требуется новое или иное, и корректирует свои действия"],"o":[],"m":[],"cmp":[]},{"n":107,"t":"Отсутствие самообладания","b":"stopper","nr":["Плохо справляется со стрессами и напряжением","Дает волю эмоциям, становится необъективным и непредсказуемым, когда не все «идет по плану","По мере того, как напряжение усиливается, может стать раздражительным и саркастичным или отстраняется","В стрессовой ситуации может принять непродуманное или неверное решение","Хуже работает, если возникают трудности"],"p":["Не дает воли эмоциям в стрессовых ситуациях","Не пасует в конфликтных ситуациях","Критика и саркастические замечания не выводят его из себя","Не теряет равновесия в стрессовых ситуациях","Не отвлекается от главной задачи","Не выходит из себя, когда что-то идет не по плану","Сталкиваясь с трудностями, просто удваивает усилия","Понимает, что возможны неожиданности","Помогает другим сохранять спокойствие, когда начинает «штормить"],"o":[],"m":[],"cmp":[]},{"n":108,"t":"Обидчивость","b":"stopper","nr":["Плохо воспринимает критику","Отрицает, что допустил ошибку или провинился","Стремится объяснить неудачи объективными обстоятельствами","Неприязненно относится к человеку, от которого узнает что-то плохое","Винит других за собственные неудачи","Не воспринимает и не слышит критические мнения о себе и своей работе","Никогда не обсуждает с другими собственные недостатки","Обмен мнениями в формальной обстановке, например, на семинаре или в рабочей группе, мало что ему дает"],"p":["Относится к критике как к возможности узнать что-то новое","Внимательно выслушивает отрицательные мнения о себе","Делает конструктивные выводы из критики","Признает собственные ошибки и недостатки","Берет на себя ответственность, когда возникают трудности","С пользой посещает семинары и рабочие группы по самосовершенствованию","Благодарит тек, кто высказывает о нем свое мнение"],"o":[],"m":[],"cmp":[]},{"n":109,"t":"Отсутствие воспитания и этических принципов","b":"stopper","nr":["Не чувствует, что необходимо придерживать ценностей, принятых в организации","Действует «на грани допустимого","Злоупотребляет терпимостью окружающих","Понятие нормы для него не существует"],"p":["Имеет ценности и принципы, которые обычно не противоречат тому, что принято в организации","Действует в рамках, которые большинство сочли бы приемлемыми","У него спрашивают, этичен ли какой-либо поступок и укладывается ли он в норму","Не колеблется в кризисных ситуациях, требующих принятия этических решений","Способен сформулировать, каких ценностей придерживается он сам и другие","Может помочь в принятии этичного/корректного решения Является образцом этических принципо const BY = {}; DATA.forEach(d=>BY[d.n]=d);
const KEY='lominger_v1';
let S = JSON.parse(localStorage.getItem(KEY)||'{}');
S.done = S.done||{}; S.ans = S.ans||{};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const total=DATA.length;
function progress(){
  const d=Object.keys(S.done).length;
  document.getElementById('pb').style.width=(d/total*100).toFixed(1)+'%';
  document.getElementById('pinfo').textContent='Пройдено '+d+' из '+total;
}
function grpClass(k){return k==='nr'?'r':k==='p'?'g':'y'}
function labels(k){return k==='nr'?'Что не развито':k==='p'?'Сильная сторона':k==='m'?'Средний уровень':'Чрезмерно / перегиб'}

function home(){
  const d=Object.keys(S.done).length;
  let next=DATA.find(x=>!S.done[x.n]) || DATA[0];
  const comp=DATA.filter(x=>x.b==='competency').length, crit=DATA.filter(x=>x.b==='criteria').length, stop=DATA.filter(x=>x.b==='stopper').length;
  const h=`
   <div class="card">
     <div class="hint">Отмечай формулировки, которые про тебя. По методике книги потребность подтверждена, если подходят 2+ формулировки. Можно возвращаться и менять ответы.</div>
     <div class="res">
       <div class="pill"><b>${comp}</b>компетенций</div>
       <div class="pill"><b>${crit}</b>критерия эффективности</div>
       <div class="pill"><b>${stop}</b>стопперов карьеры</div>
       <div class="pill"><b>${d}</b>пройдено</div>
     </div>
     <button class="primary" onclick="go(${next.n})">${d===0?'Начать':'Продолжить'} — №${next.n} ${esc(next.t)}</button>
     <button onclick="list('competency')">Компетенции 1–67</button>
     <button onclick="list('criteria')">Критерии эффективности 81–89</button>
     <button onclick="list('stopper')">Стопперы карьеры 101–119</button>
     <button onclick="results()">Итоги и выгрузка</button>
     <button class="ghost" onclick="if(confirm('Сбросить все ответы?')){S={done:{},ans:{}};save();render()}" style="font-size:13px;color:#9aa3b2">Сбросить ответы</button>
   </div>`;
  paint(h,false);
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function list(b){
  const arr=DATA.filter(x=>x.b===b);
  let h='<div class="card"><h2>'+({competency:'Компетенции',criteria:'Критерии эффективности',stopper:'Стопперы карьеры'}[b])+'</h2>';
  arr.forEach(x=>{
    const done=S.done[x.n];
    const a=S.ans[x.n]||{};
    const marks=(a.nr?a.nr.length:0)+(a.p?a.p.length:0)+(a.o?a.o.length:0)+(a.m?a.m.length:0);
    h+=`<div class="row" onclick="go(${x.n})" style="cursor:pointer">
      <div><span class="num">${x.n}</span>${esc(x.t)}</div>
      <div class="tag">${done?'<span class="ok">✓</span>':''} ${marks?marks+' отм.':''}</div></div>`;
  });
  h+='<button class="ghost" onclick="render()" style="margin-top:12px">← На главную</button></div>';
  paint(h,false);
}
function go(n){
  const d=BY[n]; const a=S.ans[n]||{};
  let h=`<div class="card"><div><span class="num">${d.n}</span><span class="tag">${{competency:'компетенция',criteria:'критерий эффективности',stopper:'стоппер карьеры'}[d.b]}</span></div>
   <h2>${esc(d.t)}</h2>
   <div class="hint">Отметь всё, что про тебя сейчас. Ничего не отмечать — тоже ответ.</div>`;
  ['nr','m','p','o'].forEach(k=>{
    const list=d[k]||[]; if(!list.length) return;
    h+=`<div class="grp ${grpClass(k)}"><h3>${labels(k)}</h3>`;
    list.forEach((txt,i)=>{
      const on=(a[k]||[]).includes(i);
      h+=`<div class="it ${on?'on':''}" onclick="tog('${k}',${i},this)"><div class="bx">${on?'✓':''}</div><div>${esc(txt)}</div></div>`;
    });
    h+='</div>';
  });
  if(d.cmp&&d.cmp.length) h+='<div class="hint" style="margin-top:12px">Компенсаторы по книге: '+d.cmp.join(', ')+'</div>';
  h+='</div>';
  paint(h,true);
  window.__cur=n;
  const ft=document.getElementById('ft');
  ft.style.display='flex';
  ft.innerHTML=`<button onclick="render()">←</button>
    <button onclick="skip(${n})">Пропустить</button>
    <button class="primary" onclick="next(${n})">Дальше →</button>`;
}
function tog(k,i,el){
  const n=window.__cur; const a=S.ans[n]||(S.ans[n]={});
  a[k]=a[k]||[];
  const p=a[k].indexOf(i);
  if(p>=0) a[k].splice(p,1); else a[k].push(i);
  el.classList.toggle('on');
  const bx=el.querySelector('.bx'); bx.textContent=el.classList.contains('on')?'✓':'';
  save();
}
function next(n){
  S.done[n]=1; save();
  const idx=DATA.findIndex(x=>x.n===n);
  for(let i=idx+1;i<DATA.length;i++) if(!S.done[DATA[i].n]) return go(DATA[i].n);
  results();
}
function skip(n){S.done[n]=1;save();next(n)}
function score(n){
  const a=S.ans[n]||{}; const g=k=>(a[k]||[]).length;
  return {nr:g('nr'),p:g('p'),o:g('o'),m:g('m')};
}
function results(){
  const rows=DATA.map(d=>{const s=score(d.n);return {d,s}});
  const def=rows.filter(r=>r.s.nr>=2).sort((x,y)=>y.s.nr-x.s.nr);
  const over=rows.filter(r=>r.s.o>=2).sort((x,y)=>y.s.o-x.s.o);
  const str=rows.filter(r=>r.s.p>=2).sort((x,y)=>y.s.p-x.s.p);
  const empty=rows.filter(r=>!r.s.nr&&!r.s.p&&!r.s.o&&!r.s.m);
  let h=`<div class="card"><h2>Итоги</h2>
   <div class="res"><div class="pill"><b>${def.length}</b>зон дефицита</div>
   <div class="pill"><b>${over.length}</b>перегибов</div>
   <div class="pill"><b>${str.length}</b>сильных сторон</div>
   <div class="pill"><b>${empty.length}</b>без ответа</div></div>`;
  const block=(title,arr,cls)=>`<div class="grp ${cls}"><h3>${title}</h3>`+(arr.length?arr.map(r=>`<div class="row" onclick="go(${r.d.n})"><div><span class="num">${r.d.n}</span>${esc(r.d.t)}</div><div class="tag">${r.s.nr}× / ${r.s.p}× / ${r.s.o}×</div></div>`).join(''):'<div class="hint">пока пусто</div>')+'</div>';
  h+=block('Дефицит (2+ отметки)',def,'r');
  h+=block('Перегиб: сильная сторона мешает (2+)',over,'y');
  h+=block('Сильные стороны (2+)',str,'g');
  h+=`<div class="hint" style="margin-top:14px">Готовый текст для отчёта:</div><textarea id="txt" readonly></textarea>
   <div class="navrow"><button onclick="copyTxt()">Скопировать</button><button onclick="dl()">Скачать JSON</button></div>
   <button class="ghost" onclick="render()" style="margin-top:12px">← На главную</button></div>`;
  paint(h,false);
  document.getElementById('txt').value=exportText(def,over,str);
  window.__exp={def,over,str};
}
function exportText(def,over,str){
  const L=['ЛОМИНГЕР — мои результаты ('+new Date().toLocaleDateString('ru-RU')+')','','ДЕФИЦИТ:'];
  def.forEach(r=>L.push(`- ${r.d.n} ${r.d.t} (${r.s.nr} отметки): `+((S.ans[r.d.n]||{}).nr||[]).map(i=>r.d.nr[i]).join('; ')));
  L.push('','ПЕРЕГИБ:'); over.forEach(r=>L.push(`- ${r.d.n} ${r.d.t} (${r.s.o}): `+((S.ans[r.d.n]||{}).o||[]).map(i=>r.d.o[i]).join('; ')));
  L.push('','СИЛЬНЫЕ:'); str.forEach(r=>L.push(`- ${r.d.n} ${r.d.t} (${r.s.p}): `+((S.ans[r.d.n]||{}).p||[]).map(i=>r.d.p[i]).join('; ')));
  return L.join('\n');
}
function copyTxt(){const t=document.getElementById('txt');t.select();document.execCommand('copy');alert('Скопировано')}
function dl(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lominger-answers.json';a.click()}
function paint(h,footer){document.getElementById('app').innerHTML=h;if(!footer)document.getElementById('ft').style.display='none';progress()}
function render(){home()}
render();
</script></body></html>
